name: ruhnn
description: >-
  Ruhnn Holding Limited (如涵控股) is a Hangzhou-based Chinese influencer (KOL)
  incubation, marketing, and e-commerce company. It pioneered the "internet
  celebrity" (wanghong) commercialization model, signing and developing
  influencers and monetizing their audiences through self-operated online
  stores on marketplaces such as Taobao and Tmall, as well as through a
  platform/advertising business that connects its network of KOLs with
  third-party brands for social-marketing campaigns. The company listed on
  NASDAQ under the ticker RUHN in 2019 and was subsequently taken private. It
  is surfaced here as a portfolio company of Qiming Venture Partners. Ruhnn is
  a consumer-facing influencer marketing and commerce operator and does not
  publish a public developer platform, API, or SDK surface.
